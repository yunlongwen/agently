version: "3.8"

services:
  agently:
    build:
      context: .
      dockerfile: Dockerfile
    image: agently:latest
    container_name: agently
    user: "1000:1000"
    volumes:
      # Mount workspace directory
      - ${WORKSPACE:-./workspace}:/workspace
      # Mount config directory
      - ${CONFIG_DIR:-~/.config/agently}:/home/agently/.config/agently
      # Mount cache directory
      - ${CACHE_DIR:-~/.cache/agently}:/home/agently/.cache/agently
    environment:
      - AGENTLY_LOG_LEVEL=${LOG_LEVEL:-INFO}
      - AGENTLY_LOG_FORMAT=${LOG_FORMAT:-json}
      - AGENTLY_OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - AGENTLY_ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - AGENTLY_MAX_MEMORY_MB=4096
      - AGENTLY_MAX_CONCURRENT_SESSIONS=5
    working_dir: /workspace
    stdin_open: true
    tty: true
    command: ["chat"]

# Pre-commit hooks configuration
# See https://pre-commit.com for more information

repos:
  # Ruff - Fast Python linter and formatter
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.0
    hooks:
      # Linting
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      # Formatting
      - id: ruff-format

  # MyPy - Static type checker
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy src/
        language: system
        types: [python]
        pass_filenames: false

  # Pytest - Run tests
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: pytest --cov=agently --cov-report=term-missing --cov-fail-under=80
        language: system
        pass_filenames: false
        always_run: true
